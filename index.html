<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위메이크 회의실 예약 시스템</title>
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="위메이크 예약">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#1a1a2e;min-height:100vh}
.pg{display:none}.pg.on{display:block}
.wrap{max-width:720px;margin:0 auto;padding:1rem;min-height:100vh}
.card{background:#fff;border:1px solid #e8e9ef;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;border:1px solid #d0d3e0;background:#fff;color:#1a1a2e;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s}
.btn:hover{background:#f0f2f8}.btn:active{transform:scale(.98)}
.bp{background:#185FA5;color:#fff;border-color:#185FA5}.bp:hover{background:#0C447C;color:#fff}
.bs{background:#3B6D11;color:#fff;border-color:#3B6D11}.bs:hover{background:#27500A}
.bd{color:#A32D2D;border-color:#F09595}.bd:hover{background:#FCEBEB}
.bw{color:#633806;border-color:#FAC775}.bw:hover{background:#FAEEDA}
.sm{padding:5px 10px;font-size:13px}.xs{padding:3px 8px;font-size:12px}
input,select{width:100%;padding:9px 12px;border:1px solid #d0d3e0;border-radius:8px;background:#fff;color:#1a1a2e;font-size:14px;margin-bottom:8px;outline:none}
input:focus,select:focus{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.1)}
label{font-size:13px;color:#666;display:block;margin-bottom:3px}
.bge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.bb{background:#E6F1FB;color:#0C447C}.bg{background:#EAF3DE;color:#27500A}
.ba{background:#FAEEDA;color:#633806}.bgr{background:#f0f2f8;color:#666}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid #e8e9ef}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem}
.tab{flex:1;padding:9px;border-radius:8px;border:1px solid #d0d3e0;background:#fff;color:#666;cursor:pointer;font-size:13px;font-weight:500;text-align:center;transition:all .15s}
.tab.on{background:#185FA5;color:#fff;border-color:#185FA5}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.cw{border:1px solid #e8e9ef;border-radius:10px;padding:10px;background:#fff}
.cd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ch{text-align:center;font-size:12px;color:#888;padding:3px 0}
.cc{text-align:center;padding:7px 2px;font-size:13px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cc:hover:not(.past):not(.oth){background:#f0f2f8}
.cc.tod{border-color:#185FA5;color:#185FA5;font-weight:600}
.cc.sel{background:#185FA5;color:#fff}
.cc.past,.cc.oth{color:#ccc;cursor:default}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:320px;overflow-y:auto}
.slot{padding:8px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;border:1px solid #e8e9ef;line-height:1.4;transition:all .12s}
.slot.free:hover{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.slot.taken{background:#FCEBEB;color:#A32D2D;border-color:#F09595;cursor:not-allowed}
.slot.pend{background:#FAEEDA;color:#633806;border-color:#FAC775;cursor:not-allowed}
.slot.past-time{background:#f0f2f8;color:#bbb;border-color:#e8e9ef;cursor:not-allowed}
.slot.pick{background:#185FA5;color:#fff;border-color:#185FA5}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:60px 1rem 1rem}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;border:1px solid #e8e9ef;padding:1.5rem;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem}
.err{font-size:13px;color:#A32D2D;margin-bottom:8px;display:none;background:#FCEBEB;padding:8px 10px;border-radius:6px}
.ok{font-size:13px;color:#27500A;margin-bottom:8px;display:none;background:#EAF3DE;padding:8px 10px;border-radius:6px}
.abanner{background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#633806;display:flex;align-items:center;gap:8px}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:#666;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #e8e9ef;border-top-color:#185FA5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f8}
.mrow:last-child{border-bottom:none}
.brow{padding:10px 0;border-bottom:1px solid #f0f2f8}
.brow:last-child{border-bottom:none}
.logo-area{text-align:center;margin-bottom:2rem}
.logo-icon{font-size:48px;margin-bottom:8px}
.logo-title{font-size:22px;font-weight:700;color:#185FA5}
.logo-sub{font-size:13px;color:#888;margin-top:4px}
/* 실시간 알림 토스트 */
.toast{position:fixed;top:20px;right:20px;background:#185FA5;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s ease;max-width:280px}
.toast.show{transform:translateX(0)}
@media(max-width:480px){.g2{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.tab{font-size:12px;padding:7px}.toast{top:10px;right:10px;left:10px;max-width:none}}
</style>
</head>
<body>

<script>
var SUPABASE_URL = 'https://mkizgbeujcuqszvqofiq.supabase.co';
var SUPABASE_KEY = 'sb_publishable_a7UQKRdyOk0vu6TVAafV-w_r2aIWB68';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var ADMIN_ID = '01065587737';
var ADMIN_PW = '1qw23er4';
var ME = null, CID = null, RID = null;
var CY, CM, SDATE = null, SSLOTS = [];
var ABTAB = 0, UBTAB = 0, BOOK_BACK_PAGE = 'pg-urooms';
var centers = [], rooms = [], members = [], bookings = [];
var realtimeChannel = null;
var toastTimer = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function cleanPhone(p){ return p.replace(/[^0-9]/g,''); }

function show(id){
  document.querySelectorAll('.pg').forEach(function(p){ p.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
}
function openOv(k){ document.getElementById('ov-'+k).classList.add('on'); }
function closeOv(k){ document.getElementById('ov-'+k).classList.remove('on'); }

/* ── 토스트 알림 ── */
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 4000);
}

/* ── 실시간 구독 시작 ── */
function startRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('bookings-realtime')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'bookings'}, function(payload){
      var newBook = payload.new;
      /* 중복 방지 */
      var exists = false;
      for(var i=0;i<bookings.length;i++){ if(bookings[i].id===newBook.id){ exists=true; break; } }
      if(!exists) bookings.push(newBook);

      if(ME && ME.role==='admin'){
        /* 관리자: 승인요청 들어오면 알림 + 예약관리 갱신 */
        if(newBook.status==='pending'){
          showToast('🔔 새 승인요청: '+newBook.uname+' ('+newBook.date+' '+newBook.s+'~'+newBook.e+')');
          renderAdmin();
        }
      } else if(ME && ME.role==='user'){
        /* 이용자: 예약 화면 슬롯 갱신 */
        if(SDATE && newBook.rid===RID && newBook.date===SDATE) renderSlots();
      }
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'bookings'}, function(payload){
      var updated = payload.new;
      /* 로컬 배열 업데이트 */
      for(var i=0;i<bookings.length;i++){
        if(bookings[i].id===updated.id){ bookings[i]=updated; break; }
      }

      if(ME && ME.role==='admin'){
        renderAdmin();
      } else if(ME && ME.role==='user'){
        /* 이용자: 내 예약이 승인됐으면 알림 */
        if(updated.uid===ME.uid && updated.status==='confirmed'){
          showToast('✅ 예약이 승인되었습니다! '+updated.date+' '+updated.s+'~'+updated.e);
          if(SDATE && updated.rid===RID && updated.date===SDATE) renderSlots();
          /* 내 예약 탭이 열려있으면 갱신 */
          var ut1 = document.getElementById('ut-1');
          if(ut1 && ut1.style.display==='block') renderMyBookings();
        }
      }
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'bookings'}, function(payload){
      var deletedId = payload.old.id;
      bookings = bookings.filter(function(b){ return b.id!==deletedId; });

      if(ME && ME.role==='admin'){
        renderAdmin();
      } else if(ME && ME.role==='user'){
        if(SDATE && RID) renderSlots();
        var ut1 = document.getElementById('ut-1');
        if(ut1 && ut1.style.display==='block') renderMyBookings();
      }
    })
    .subscribe();
}

function slotsRange(s,e){ var r=[],cur=s; while(cur<e){ r.push(cur); var p=cur.split(':'); var t=parseInt(p[0])*60+parseInt(p[1])+30; cur=pad(Math.floor(t/60))+':'+pad(t%60); } return r; }
async function saveBedit(){
  var id=document.getElementById('be-id').value, date=document.getElementById('be-date').value, s=document.getElementById('be-start').value, e=document.getElementById('be-end').value;
  var err=document.getElementById('be-err');
  if(s>=e){ err.textContent='종료 시간이 시작 시간보다 늦어야 합니다.'; err.style.display='block'; return; }
  var bk=null; for(var i=0;i<bookings.length;i++){ if(bookings[i].id===id){ bk=bookings[i]; break; } }
  var ns=slotsRange(s,e);
  for(var i=0;i<bookings.length;i++){
    var b=bookings[i]; if(b.id===id||b.rid!==bk.rid||b.date!==date) continue;
    var bs=b.slots||[]; for(var j=0;j<ns.length;j++){ if(bs.indexOf(ns[j])>=0){ err.textContent='해당 시간에 이미 예약이 있습니다.'; err.style.display='block'; return; } }
  }
  await sb.from('bookings').update({date:date,s:s,e:e,slots:ns}).eq('id',id);
  bk.date=date; bk.s=s; bk.e=e; bk.slots=ns;
  closeOv('bedit'); renderAdmin();
}

  var rs=[]; for(var i=0;i<rooms.length;i++){ if(rooms[i].cid===cid) rs.push(rooms[i]); }

  if(!rs.length){ el.innerHTML='<p style="color:#888;font-size:14px">등록된 회의실이 없습니다.</p>'; show('pg-admin-urooms'); return; }
  var h='';
  for(var i=0;i<rs.length;i++){
    var r=rs[i];
    h+='<div class="card" style="cursor:pointer;margin-bottom:0" onclick="openBook(\''+r.id+'\',\'admin\')">'
      +'<div style="font-weight:600;font-size:15px">'+r.name+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">'
      +'<span class="bge bb">'+r.cap+'인</span>'
      +'<span class="bge '+(r.proj?'bg':'bgr')+'">'+(r.proj?'프로젝터':'프로젝터 없음')+'</span>'
      +'<span class="bge ba">'+r.price.toLocaleString()+'원/h</span></div></div>';
  }
  el.innerHTML=h; show('pg-admin-urooms');
}

function getUser(){ for(var i=0;i<members.length;i++){ if(members[i].id===ME.uid) return members[i]; } return null; }
function uTab(n){ for(var i=0;i<2;i++){ document.getElementById('ut'+i).classList.toggle('on',i===n); document.getElementById('ut-'+i).style.display=i===n?'block':'none'; } if(n===1) renderMyBookings(); }
function ubTab(n){ UBTAB=n; for(var i=0;i<2;i++) document.getElementById('ubt'+i).classList.toggle('on',i===n); renderMyBookings(); }

function renderUser(){
  var u=getUser();
  document.getElementById('uwelcome').textContent=u.name+'님 환영합니다'+(u.tenancy?' ('+u.tenancy+')':'');
  var b=document.getElementById('ubanner');
  b.innerHTML=!u.tenancy?'<div class="abanner">ℹ️ 입주정보 없음 — 예약 시 관리자 승인이 필요합니다.</div>':'';
  document.getElementById('ut0').classList.add('on'); document.getElementById('ut1').classList.remove('on');
  document.getElementById('ut-0').style.display='block'; document.getElementById('ut-1').style.display='none';
  renderUcenters();
}
function renderUcenters(){
  var el=document.getElementById('list-ucenters');
  if(!centers.length){ el.innerHTML='<p style="color:#888;font-size:14px;padding:1rem 0">등록된 센터가 없습니다.</p>'; return; }
  var h='';
  for(var i=0;i<centers.length;i++){
    var c=centers[i]; var rc=0; for(var j=0;j<rooms.length;j++){ if(rooms[j].cid===c.id) rc++; }
    h+='<div class="card" style="cursor:pointer" onclick="openUrooms(\''+c.id+'\')">'
      +'<div style="display:flex;align-items:center;justify-content:space-between">'
      +'<div style="font-weight:600;font-size:15px">'+c.name+'</div><span class="bge bb">'+rc+'개 회의실</span></div>'
      +'<div style="font-size:13px;color:#666;margin-top:4px">'+c.phone+' | '+c.addr+'</div></div>';
  }
  el.innerHTML=h;
}
function openUrooms(cid){
  CID=cid; var c=null; for(var i=0;i<centers.length;i++){ if(centers[i].id===cid){ c=centers[i]; break; } }
  document.getElementById('uroom-cinfo').innerHTML='<div style="font-size:16px;font-weight:600">'+c.name+'</div><div style="font-size:13px;color:#666;margin-top:3px">'+c.phone+' | '+c.addr+'</div>';
  var rs=[]; for(var i=0;i<rooms.length;i++){ if(rooms[i].cid===cid) rs.push(rooms[i]); }
  var el=document.getElementById('list-urooms');
  if(!rs.length){ el.innerHTML='<p style="color:#888;font-size:14px">등록된 회의실이 없습니다.</p>'; show('pg-urooms'); return; }
  var h='';
  for(var i=0;i<rs.length;i++){
    var r=rs[i];
    h+='<div class="card" style="cursor:pointer;margin-bottom:0" onclick="openBook(\''+r.id+'\',\'user\')">'
      +'<div style="font-weight:600;font-size:15px">'+r.name+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">'
      +'<span class="bge bb">'+r.cap+'인</span>'
      +'<span class="bge '+(r.proj?'bg':'bgr')+'">'+(r.proj?'프로젝터':'프로젝터 없음')+'</span>'
      +'<span class="bge ba">'+r.price.toLocaleString()+'원/h</span></div></div>';
  }
  el.innerHTML=h; show('pg-urooms');
}
function renderMyBookings(){
  var el=document.getElementById('my-bookings');
  var status=UBTAB===0?'confirmed':'pending';
  var list=[]; for(var i=0;i<bookings.length;i++){ if(bookings[i].uid===ME.uid&&bookings[i].status===status) list.push(bookings[i]); }
  if(!list.length){ el.innerHTML='<p style="color:#888;font-size:14px;padding:.5rem 0">'+(UBTAB===0?'확정된 예약이 없습니다.':'승인 대기 중인 예약이 없습니다.')+'</p>'; return; }
  var h='<div class="card" style="padding:.25rem 1.25rem">';
  for(var i=0;i<list.length;i++){
    var bk=list[i]; var rn='?',cn='?';
    for(var j=0;j<rooms.length;j++){ if(rooms[j].id===bk.rid){ rn=rooms[j].name; break; } }
    for(var j=0;j<centers.length;j++){ if(centers[j].id===bk.cid){ cn=centers[j].name; break; } }
    h+='<div class="brow"><div style="font-weight:600;font-size:14px">'+cn+' — '+rn+'</div>'
      +'<div style="font-size:13px;color:#666;margin-top:2px">'+bk.date+' '+bk.s+'~'+bk.e+'</div>'
      +(bk.status==='confirmed'?'<span class="bge bg" style="margin-top:4px">✅ 확정</span>':'<span class="bge ba" style="margin-top:4px">⏳ 승인 대기</span>')
      +'</div>';
  }
  h+='</div>'; el.innerHTML=h;
}

function openBook(rid, caller){
  RID=rid; SDATE=null; SSLOTS=[];
  BOOK_BACK_PAGE=caller==='admin'?'pg-admin-urooms':'pg-urooms';
  var r=null; for(var i=0;i<rooms.length;i++){ if(rooms[i].id===rid){ r=rooms[i]; break; } }
  document.getElementById('book-rinfo').innerHTML='<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-weight:600;font-size:16px">'+r.name+'</div><div style="display:flex;gap:5px"><span class="bge bb">'+r.cap+'인</span><span class="bge ba">'+r.price.toLocaleString()+'원/h</span></div></div>';
  document.getElementById('book-back').onclick=function(){ show(BOOK_BACK_PAGE); };
  if(ME.role==='admin'){ document.getElementById('book-btn').textContent='예약 확정'; }
  else { var u=getUser(); document.getElementById('book-btn').textContent=u.tenancy?'예약 확정':'승인 요청'; }
  var now=new Date(); CY=now.getFullYear(); CM=now.getMonth();
  renderCal();
  document.getElementById('slots').innerHTML='';
  document.getElementById('slot-lbl').textContent='날짜를 선택하세요';
  document.getElementById('selbox').style.display='none';
  show('pg-book');
}

function mv(d){ CM+=d; if(CM>11){CM=0;CY++;} if(CM<0){CM=11;CY--;} renderCal(); }
function renderCal(){
  document.getElementById('cal-lbl').textContent=CY+'년 '+(CM+1)+'월';
  var first=new Date(CY,CM,1).getDay(), last=new Date(CY,CM+1,0).getDate();
  var today=new Date(); today.setHours(0,0,0,0);
  var h='';
  for(var i=0;i<first;i++){ var pd=new Date(CY,CM,1-first+i); h+='<div class="cc oth">'+pd.getDate()+'</div>'; }
  for(var d=1;d<=last;d++){
    var dt=new Date(CY,CM,d); var s=dateStr(dt); var cls='cc';
    if(dt<today) cls+=' past';
    else if(s===SDATE) cls+=' sel';
    else if(dt.getTime()===today.getTime()) cls+=' tod';
    h+='<div class="'+cls+'"'+(dt>=today?' onclick="selDay(\''+s+'\')"':'')+'>'+d+'</div>';
  }
  document.getElementById('cal-cells').innerHTML=h;
}
function selDay(s){
  SDATE=s; SSLOTS=[]; renderCal();
  var p=s.split('-');
  document.getElementById('slot-lbl').textContent=p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일';
  renderSlots(); document.getElementById('selbox').style.display='none';
}
function renderSlots(){
  var conf=[], pend=[];
  for(var i=0;i<bookings.length;i++){
    var b=bookings[i]; if(b.rid!==RID||b.date!==SDATE) continue;
    var sl=b.slots||[];
    if(b.status==='confirmed'){ for(var j=0;j<sl.length;j++) conf.push(sl[j]); }
    else if(b.status==='pending'){ for(var j=0;j<sl.length;j++) pend.push(sl[j]); }
  }
  var now=new Date(), todayStr=dateStr(now), nowMin=now.getHours()*60+now.getMinutes();
  var h='';
  for(var hr=8;hr<22;hr++){
    for(var mn=0;mn<60;mn+=30){
      var sl=pad(hr)+':'+pad(mn);
      var nh=mn===30?hr+1:hr, nm=mn===30?0:30, en=pad(nh)+':'+pad(nm);
      var isC=conf.indexOf(sl)>=0, isP=pend.indexOf(sl)>=0, isPk=SSLOTS.indexOf(sl)>=0;
      var isPast=(SDATE===todayStr&&(hr*60+mn)<=nowMin);
      var cls, cl;
      if(isC){ cls='slot taken'; cl=''; }
      else if(isP){ cls='slot pend'; cl=''; }
      else if(isPast){ cls='slot past-time'; cl=''; }
      else if(isPk){ cls='slot pick'; cl='onclick="toggleSlot(\''+sl+'\')"'; }
      else { cls='slot free'; cl='onclick="toggleSlot(\''+sl+'\')"'; }
      h+='<div class="'+cls+'" '+cl+'>'+sl+'~'+en
        +(isC?'<br><span style="font-size:10px">예약됨</span>'
        :isP?'<br><span style="font-size:10px">대기중</span>'
        :isPast?'<br><span style="font-size:10px">지난시간</span>':'')+'</div>';
    }
  }
  document.getElementById('slots').innerHTML=h;
}
function toggleSlot(s){ var i=SSLOTS.indexOf(s); if(i>=0) SSLOTS.splice(i,1); else SSLOTS.push(s); SSLOTS.sort(); renderSlots(); updateSel(); }
function updateSel(){
  if(!SSLOTS.length){ document.getElementById('selbox').style.display='none'; return; }
  document.getElementById('selbox').style.display='block';
  var r=null; for(var i=0;i<rooms.length;i++){ if(rooms[i].id===RID){ r=rooms[i]; break; } }
  var total=Math.round(r.price*SSLOTS.length*0.5);
  document.getElementById('sel-txt').textContent=SSLOTS[0]+' ~ '+endOf(SSLOTS);
  document.getElementById('sel-price').textContent='예상금액: '+total.toLocaleString()+'원 ('+SSLOTS.length*30+'분)';
}
function endOf(sl){ var last=sl[sl.length-1]; var p=last.split(':'); var t=parseInt(p[0])*60+parseInt(p[1])+30; return pad(Math.floor(t/60))+':'+pad(t%60); }

function openBconfirm(){
  if(!SSLOTS.length) return;
  var r=null; for(var i=0;i<rooms.length;i++){ if(rooms[i].id===RID){ r=rooms[i]; break; } }
  var total=Math.round(r.price*SSLOTS.length*0.5);
  var p=SDATE.split('-');
  var isAdmin=ME.role==='admin';
  var uname=isAdmin?'관리자':getUser().name;
  var uphone=isAdmin?ADMIN_ID:getUser().phone;
  var willConfirm=isAdmin||(getUser()&&!!getUser().tenancy);
  document.getElementById('bc-info').innerHTML=
    '<strong>'+r.name+'</strong><br>'+p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일<br>'
    +SSLOTS[0]+' ~ '+endOf(SSLOTS)+' ('+SSLOTS.length*30+'분)<br>'
    +'예상금액: <strong>'+total.toLocaleString()+'원</strong><br>예약자: '+uname+' ('+uphone+')'
    +(!isAdmin&&getUser()&&!getUser().tenancy?'<br><span style="color:#633806;font-size:12px">⚠️ 입주정보 없음 — 관리자 승인 후 확정</span>':'');
  document.getElementById('bc-t').textContent=willConfirm?'예약 확정':'승인 요청';
  document.getElementById('bc-btn').textContent=willConfirm?'확정하기':'승인 요청';
  document.getElementById('bc-err').style.display='none';
  openOv('bconfirm');
}

async function submitBook(){
  var isAdmin=ME.role==='admin';
  var uname=isAdmin?'관리자':getUser().name;
  var uphone=isAdmin?ADMIN_ID:getUser().phone;
  var uid_val=isAdmin?'admin':getUser().id;
  var status=isAdmin?'confirmed':(getUser().tenancy?'confirmed':'pending');
  var obj={id:uid(),rid:RID,cid:CID,uid:uid_val,uname:uname,uphone:uphone,date:SDATE,s:SSLOTS[0],e:endOf(SSLOTS),slots:SSLOTS.slice(),status:status};
  var res=await sb.from('bookings').insert(obj);
  if(res.error){ alert('오류: '+res.error.message); return; }
  bookings.push(obj);
  closeOv('bconfirm'); SSLOTS=[]; renderSlots();
  document.getElementById('selbox').style.display='none';
  alert(status==='confirmed'?'✅ 예약이 확정되었습니다!':'📨 승인 요청이 완료되었습니다.\n관리자 승인 후 확정됩니다.');
}

document.getElementById('book-btn').addEventListener('click', openBconfirm);
loadAll().then(function(){ goLogin(); });
</script>
