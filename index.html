<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위메이크 회의실 예약 시스템</title>
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="위메이크 예약">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#1a1a2e;min-height:100vh}
.pg{display:none}.pg.on{display:block}
.wrap{max-width:720px;margin:0 auto;padding:1rem;min-height:100vh}
.card{background:#fff;border:1px solid #e8e9ef;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;border:1px solid #d0d3e0;background:#fff;color:#1a1a2e;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s}
.btn:hover{background:#f0f2f8}.btn:active{transform:scale(.98)}
.bp{background:#b8860b;color:#fff;border-color:#b8860b}.bp:hover{background:#8b6508;color:#fff}
.bs{background:#3B6D11;color:#fff;border-color:#3B6D11}.bs:hover{background:#27500A}
.bd{color:#A32D2D;border-color:#F09595}.bd:hover{background:#FCEBEB}
.bw{color:#633806;border-color:#FAC775}.bw:hover{background:#FAEEDA}
.sm{padding:5px 10px;font-size:13px}.xs{padding:3px 8px;font-size:12px}
input,select{width:100%;padding:9px 12px;border:1px solid #d0d3e0;border-radius:8px;background:#fff;color:#1a1a2e;font-size:14px;margin-bottom:8px;outline:none}
input:focus,select:focus{border-color:#b8860b;box-shadow:0 0 0 3px rgba(184,134,11,.1)}
label{font-size:13px;color:#666;display:block;margin-bottom:3px}
.bge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.bb{background:#E6F1FB;color:#0C447C}.bg{background:#EAF3DE;color:#27500A}
.ba{background:#FAEEDA;color:#633806}.bgr{background:#f0f2f8;color:#666}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid #e8e9ef}
/* 관리자 고정 탭 */
.admin-tabs-fixed{position:sticky;top:0;z-index:50;background:#f5f6fa;padding:.5rem 0 .75rem;margin-bottom:.5rem}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem}
.tab{flex:1;padding:9px;border-radius:8px;border:1px solid #d0d3e0;background:#fff;color:#666;cursor:pointer;font-size:13px;font-weight:500;text-align:center;transition:all .15s}
.tab.on{background:#b8860b;color:#fff;border-color:#b8860b}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.cw{border:1px solid #e8e9ef;border-radius:10px;padding:10px;background:#fff}
.cd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ch{text-align:center;font-size:12px;color:#888;padding:3px 0}
.cc{text-align:center;padding:7px 2px;font-size:13px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cc:hover:not(.past):not(.oth){background:#f0f2f8}
.cc.tod{border-color:#b8860b;color:#b8860b;font-weight:600}
.cc.sel{background:#b8860b;color:#fff}
.cc.past,.cc.oth{color:#ccc;cursor:default}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:320px;overflow-y:auto}
.slot{padding:8px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;border:1px solid #e8e9ef;line-height:1.4;transition:all .12s}
.slot.free:hover{background:#fdf3d0;border-color:#b8860b;color:#8b6508}
.slot.taken{background:#FCEBEB;color:#A32D2D;border-color:#F09595;cursor:not-allowed}
.slot.pend{background:#FAEEDA;color:#633806;border-color:#FAC775;cursor:not-allowed}
.slot.past-time{background:#f0f2f8;color:#bbb;border-color:#e8e9ef;cursor:not-allowed}
.slot.pick{background:#b8860b;color:#fff;border-color:#b8860b}
.slot.mine{background:#0C447C;color:#fff;border-color:#0C447C;cursor:not-allowed}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:60px 1rem 1rem}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;border:1px solid #e8e9ef;padding:1.5rem;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem}
.err{font-size:13px;color:#A32D2D;margin-bottom:8px;display:none;background:#FCEBEB;padding:8px 10px;border-radius:6px}
.ok{font-size:13px;color:#27500A;margin-bottom:8px;display:none;background:#EAF3DE;padding:8px 10px;border-radius:6px}
.abanner{background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#633806;display:flex;align-items:center;gap:8px}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:#666;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #e8e9ef;border-top-color:#b8860b;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f8}
.mrow:last-child{border-bottom:none}
.brow{padding:10px 0;border-bottom:1px solid #f0f2f8}
.brow:last-child{border-bottom:none}
.logo-area{text-align:center;margin-bottom:2rem}
.logo-icon{margin-bottom:8px}
.logo-title{font-size:22px;font-weight:700;color:#b8860b}
.logo-sub{font-size:13px;color:#888;margin-top:4px}
.toast{position:fixed;top:20px;right:20px;background:#185FA5;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateX(120%);transition:transform .3s ease;max-width:300px;line-height:1.5}
.toast.show{transform:translateX(0)}
.toast-confirm{display:block;margin-top:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;width:100%;text-align:center}
.toast-confirm:hover{background:rgba(255,255,255,.3)}
.toast.green{background:#3B6D11}
.toast.red{background:#A32D2D}
.book-item{cursor:pointer;transition:background .12s}
.book-item:hover{background:#f0f8ff}
@media(max-width:480px){.g2{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.tab{font-size:12px;padding:7px}.toast{top:10px;right:10px;left:10px;max-width:none}}
</style>
</head>

</div>

var SUPABASE_URL = 'https://mkizgbeujcuqszvqofiq.supabase.co';

function showToast(msg, color){
  var t=document.getElementById('toast');
  t.className='toast'+(color?' '+color:'');
  var confirmFn = (ME&&ME.role==='admin') ? 'goToPendingTabFromToast()' : 'dismissToast()';
  t.innerHTML=msg+'<button class="toast-confirm" onclick="'+confirmFn+'">확인</button>';
  t.classList.add('show');
}
function dismissToast(){ document.getElementById('toast').classList.remove('show'); }
function goToPendingTab(){

}

/* ── 폴링 ── */
function startPolling(){ stopPolling(); pollTimer=setInterval(function(){ if(ME) pollBookings(); },POLL_INTERVAL); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function pollBookings(){
  try{
    var res=await sb.from('bookings').select('*').order('created_at');
    if(!res.data) return;
    var nb=res.data;
    if(ME && ME.role==='user'){
      for(var i=0;i<nb.length;i++){
        var b=nb[i]; if(b.uid!==ME.uid) continue;
        for(var j=0;j<bookings.length;j++){
          if(bookings[j].id===b.id && bookings[j].status==='pending' && b.status==='confirmed'){
            showToast('✅ 예약이 승인되었습니다!<br><strong>'+b.date+' '+b.s+'~'+b.e+'</strong>','green'); break;
          }
          if(bookings[j].id===b.id && bookings[j].status==='cancel_request' && b.status===undefined){
            showToast('🗑️ 취소 요청이 처리되었습니다.','red'); break;
          }
        }
      }
      /* 삭제된 취소요청 감지 */
      for(var j=0;j<bookings.length;j++){
        if(bookings[j].uid!==ME.uid || bookings[j].status!=='cancel_request') continue;
        var found=false;
        for(var i=0;i<nb.length;i++){ if(nb[i].id===bookings[j].id){ found=true; break; } }
        if(!found) showToast('🗑️ 예약 취소가 완료되었습니다.<br><strong>'+bookings[j].date+' '+bookings[j].s+'~'+bookings[j].e+'</strong>','red');
      }
      bookings=nb;
      var ut1=document.getElementById('ut-1');
      if(ut1 && ut1.style.display==='block') renderMyBookings();
      if(SDATE && RID) renderSlots();
    } else if(ME && ME.role==='admin'){
      for(var i=0;i<nb.length;i++){
        var b=nb[i]; if(b.status!=='pending' && b.status!=='cancel_request') continue;
        var found=false;
        for(var j=0;j<bookings.length;j++){ if(bookings[j].id===b.id){ found=true; break; } }
        if(!found){
          if(b.status==='pending') showToast('🔔 새 승인요청!<br><strong>'+b.uname+'</strong><br>'+b.date+' '+b.s+'~'+b.e,'');
          if(b.status==='cancel_request') showToast('⚠️ 취소요청!<br><strong>'+b.uname+'</strong><br>'+b.date+' '+b.s+'~'+b.e,'');
        }
      }
      bookings=nb; renderAdmin();
    }
  }catch(e){ console.warn('poll error',e); }
}

function startRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  realtimeChannel=sb.channel('wemake-rt-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'bookings'},function(){ pollBookings(); })
    .subscribe();
}
function stopRealtime(){ if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; } }

function goLogin(){ document.getElementById('lid').value=''; document.getElementById('lpw').value=''; document.getElementById('lerr').style.display='none'; show('pg-login'); }
function goSignup(){ ['su-name','su-phone','su-pw','su-pw2'].forEach(function(i){ document.getElementById(i).value=''; }); document.getElementById('su-err').style.display='none'; document.getElementById('su-ok').style.display='none'; show('pg-signup'); }

async function loadAll(){
  try{
    var r1=await sb.from('centers').select('*').order('created_at'); if(r1.data) centers=r1.data;
    var r2=await sb.from('rooms').select('*').order('created_at'); if(r2.data) rooms=r2.data;
    var r3=await sb.from('members').select('*').order('created_at'); if(r3.data) members=r3.data;
    var r4=await sb.from('bookings').select('*').order('created_at'); if(r4.data) bookings=r4.data;
  }catch(e){ console.warn('load error',e); }
}

async function doLogin(){
  var id=cleanPhone(document.getElementById('lid').value.trim());
  var pw=document.getElementById('lpw').value.trim();
  var err=document.getElementById('lerr');
  if(id===ADMIN_ID&&pw===ADMIN_PW){ ME={role:'admin'}; err.style.display='none'; await loadAll(); startRealtime(); startPolling(); renderAdmin(); show('pg-admin'); return; }
  var u=null; for(var i=0;i<members.length;i++){ if(members[i].phone===id&&members[i].pw===pw){ u=members[i]; break; } }
  if(u){ ME={role:'user',uid:u.id}; err.style.display='none'; startRealtime(); startPolling(); renderUser(); show('pg-user'); }
  else { err.style.display='block'; }
}

async function doSignup(){
  var name=document.getElementById('su-name').value.trim();
  var phone=cleanPhone(document.getElementById('su-phone').value.trim());
  var pw=document.getElementById('su-pw').value, pw2=document.getElementById('su-pw2').value;
  var err=document.getElementById('su-err'), ok=document.getElementById('su-ok');
  err.style.display='none'; ok.style.display='none';
  if(!name){ err.textContent='이름을 입력하세요.'; err.style.display='block'; return; }
  if(!/^01[0-9]{8,9}$/.test(phone)){ err.textContent='올바른 핸드폰번호를 입력하세요.'; err.style.display='block'; return; }
  for(var i=0;i<members.length;i++){ if(members[i].phone===phone){ err.textContent='이미 가입된 번호입니다.'; err.style.display='block'; return; } }
  if(!/^(?=.*[a-zA-Z])(?=.*[0-9]).{8,}$/.test(pw)){ err.textContent='비밀번호: 영문+숫자 조합 8자 이상'; err.style.display='block'; return; }
  if(pw!==pw2){ err.textContent='비밀번호가 일치하지 않습니다.'; err.style.display='block'; return; }
  var newM={id:uid(),name:name,phone:phone,pw:pw,tenancy:'',company:''};
  var res=await sb.from('members').insert(newM);
  if(res.error){ err.textContent='오류: '+res.error.message; err.style.display='block'; return; }
  members.push(newM); ok.style.display='block';
  ['su-name','su-phone','su-pw','su-pw2'].forEach(function(i){ document.getElementById(i).value=''; });
  setTimeout(function(){ goLogin(); },1500);
}

function logout(){ ME=null; SSLOTS=[]; SDATE=null; stopRealtime(); stopPolling(); goLogin(); }

function renderAdmin(){
  var pending=0, cancelReq=0;
  for(var i=0;i<bookings.length;i++){
    if(bookings[i].status==='pending') pending++;
    if(bookings[i].status==='cancel_request') cancelReq++;
  }
  var b=document.getElementById('pending-banner');
  var msgs=[];
  if(pending>0) msgs.push('승인 대기 <strong>'+pending+'건</strong>');
  if(cancelReq>0) msgs.push('취소 요청 <strong>'+cancelReq+'건</strong>');
  b.innerHTML=msgs.length?'<div class="abanner" style="cursor:pointer" onclick="goToPendingTab()">🔔 '+msgs.join(' | ')+' 있습니다. <span style="font-size:12px;text-decoration:underline">바로가기 →</span></div>':'';
  renderCenters(); renderMembers(); renderAdminBooks(); renderAdminBookCenters();

  var el=document.getElementById('list-centers');

function renderCal(){

function renderSlots(){
  var conf=[], pend=[], mine=[];
  var myUid=ME&&ME.uid?ME.uid:null;
  for(var i=0;i<bookings.length;i++){
    var b=bookings[i]; if(b.rid!==RID||b.date!==SDATE) continue;
    var sl=b.slots||[];
    if(b.status==='confirmed'||b.status==='cancel_request'){
      if(myUid && b.uid===myUid){ for(var j=0;j<sl.length;j++) mine.push(sl[j]); }
      else { for(var j=0;j<sl.length;j++) conf.push(sl[j]); }
    }
    else if(b.status==='pending'){ for(var j=0;j<sl.length;j++) pend.push(sl[j]); }
  }
  var now=new Date(), todayStr=dateStr(now), nowMin=now.getHours()*60+now.getMinutes();
  var h='';
  for(var hr=8;hr<22;hr++){
    for(var mn=0;mn<60;mn+=30){
      var sl=pad(hr)+':'+pad(mn);
      var nh=mn===30?hr+1:hr, nm=mn===30?0:30, en=pad(nh)+':'+pad(nm);
      var isC=conf.indexOf(sl)>=0, isP=pend.indexOf(sl)>=0, isPk=SSLOTS.indexOf(sl)>=0;
      var isM=mine.indexOf(sl)>=0;
      var isPast=(SDATE===todayStr&&(hr*60+mn)<=nowMin);
      var cls, cl;
      if(isM){ cls='slot mine'; cl=''; }
      else if(isC){ cls='slot taken'; cl=''; }
      else if(isP){ cls='slot pend'; cl=''; }
      else if(isPast){ cls='slot past-time'; cl=''; }
      else if(isPk){ cls='slot pick'; cl='onclick="toggleSlot(\''+sl+'\')"'; }
      else { cls='slot free'; cl='onclick="toggleSlot(\''+sl+'\')"'; }
      h+='<div class="'+cls+'" '+cl+'>'+sl+'~'+en
        +(isM?'<br><span style="font-size:10px">내예약</span>'
        :isC?'<br><span style="font-size:10px">예약됨</span>'
        :isP?'<br><span style="font-size:10px">대기중</span>'
        :isPast?'<br><span style="font-size:10px">지난시간</span>':'')+'</div>';
    }
  }
  document.getElementById('slots').innerHTML=h;
}

/* ── 연속된 시간만 허용 (4시간 초과는 승인요청으로 처리, 관리자는 무제한) ── */
function toggleSlot(s){
  var idx=SSLOTS.indexOf(s);
  if(idx>=0){
    SSLOTS.splice(idx,1);
  } else {
    var testSlots=SSLOTS.concat([s]).sort();
    /* 연속성 체크 */
    for(var i=0;i<testSlots.length-1;i++){
      var p=testSlots[i].split(':'); var t=parseInt(p[0])*60+parseInt(p[1])+30;
      var next=pad(Math.floor(t/60))+':'+pad(t%60);
      if(testSlots[i+1]!==next){
        alert('연속된 시간만 선택할 수 있습니다.');
        return;
      }
    }
    SSLOTS=testSlots;
  }
  SSLOTS.sort(); renderSlots(); updateSel();
}

function updateSel(){
  if(!SSLOTS.length){ document.getElementById('selbox').style.display='none'; return; }
  document.getElementById('selbox').style.display='block';
  var r=null; for(var i=0;i<rooms.length;i++){ if(rooms[i].id===RID){ r=rooms[i]; break; } }
  var total=Math.round(r.price*SSLOTS.length*0.5);
  document.getElementById('sel-txt').textContent=SSLOTS[0]+' ~ '+endOf(SSLOTS);
  document.getElementById('sel-price').textContent='예상금액: '+total.toLocaleString()+'원 ('+SSLOTS.length*30+'분)';
  /* 4시간 초과 안내 (이용자만) */
  if(ME.role!=='admin' && SSLOTS.length>8){
    document.getElementById('sel-price').textContent+=' ⚠️ 4시간 초과 — 관리자 승인 필요';
  }
  /* 예약 버튼 텍스트 업데이트 */
  if(ME.role==='admin'){
    document.getElementById('book-btn').textContent='예약 확정';
  } else {
    var u=getUser();
    /* 4시간 초과이면 입주자도 승인 요청 */
    if(SSLOTS.length>8){
      document.getElementById('book-btn').textContent='승인 요청';
    } else {
      document.getElementById('book-btn').textContent=u.tenancy?'예약 확정':'승인 요청';
    }
  }
}

function endOf(sl){ var last=sl[sl.length-1]; var p=last.split(':'); var t=parseInt(p[0])*60+parseInt(p[1])+30; return pad(Math.floor(t/60))+':'+pad(t%60); }

/* 입주 회원의 미래 확정예약 건수 계산 (시작 시간이 지나지 않은 것만) */
function countFutureConfirmed(uid){
  var now=new Date(); var count=0;
  for(var i=0;i<bookings.length;i++){
    var b=bookings[i];
    if(b.uid!==uid || b.status!=='confirmed') continue;
    var bookStart=new Date(b.date+'T'+b.s+':00');
    if(bookStart>now) count++;
  }
  return count;
}

function openBconfirm(){
  if(!SSLOTS.length) return;
  var isAdmin=ME.role==='admin';
  var u=isAdmin?null:getUser();

  /* 입주 회원 예약 건수 제한 체크 */
  if(!isAdmin && u && u.tenancy){
    var futureCount=countFutureConfirmed(ME.uid);
    if(futureCount>=4){
      alert('현재 확정예약이 4건입니다.\n예약 시작 시간이 지난 후 추가 예약이 가능합니다.');
      return;
    }
  }

  var r=null; for(var i=0;i<rooms.length;i++){ if(rooms[i].id===RID){ r=rooms[i]; break; } }
  var total=Math.round(r.price*SSLOTS.length*0.5);
  var p=SDATE.split('-');
  var uname=isAdmin?'관리자':u.name;
  var uphone=isAdmin?ADMIN_ID:u.phone;
  /* 관리자: 무조건 확정 / 입주자: 4시간 이하만 즉시확정, 초과시 승인요청 / 비입주: 항상 승인요청 */
  var over4h = SSLOTS.length > 8;
  var willConfirm = isAdmin || (u && u.tenancy && !over4h);
  var paymentGuide = !isAdmin && !willConfirm
    ? '<br><div style="margin-top:10px;padding:10px;background:#fff8e6;border-radius:8px;border:1px solid #FAC775;font-size:12px;line-height:1.8;color:#333">'
      +'💳 <strong>입금 안내</strong><br>'
      +'하나은행 206-910254-09507<br>'
      +'예금주: 백재욱<br><br>'
      +'위 계좌로 금액 입금 후<br>'
      +'📱 <strong>010-6558-7737</strong>로 문자 주세요.<br>'
      +'<span style="color:#185FA5;font-weight:600">입금 확인 즉시 예약이 확정됩니다.</span>'
      +'</div>'
    : '';
  document.getElementById('bc-info').innerHTML=
    '<strong>'+r.name+'</strong><br>'+p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일<br>'
    +SSLOTS[0]+' ~ '+endOf(SSLOTS)+' ('+SSLOTS.length*30+'분)<br>'
    +'예상금액: <strong>'+total.toLocaleString()+'원</strong><br>예약자: '+uname+' ('+uphone+')'
    +(!isAdmin&&over4h?'<br><span style="color:#633806;font-size:12px">⚠️ 4시간 초과 — 관리자 승인 후 확정</span>':'')
    +paymentGuide;
  document.getElementById('bc-t').textContent=willConfirm?'예약 확정':'승인 요청';
  document.getElementById('bc-btn').textContent=willConfirm?'확정하기':'승인 요청';
  document.getElementById('bc-err').style.display='none';
  openOv('bconfirm');
}

async function submitBook(){
  var isAdmin=ME.role==='admin';
  var uname=isAdmin?'관리자':getUser().name;
  var uphone=isAdmin?ADMIN_ID:getUser().phone;
  var uid_val=isAdmin?'admin':getUser().id;
  var u=isAdmin?null:getUser();
  var over4h=SSLOTS.length>8;
  /* 관리자: 확정 / 입주자+4시간이하: 확정 / 입주자+4시간초과: 승인요청 / 비입주: 승인요청 */
  var status=isAdmin?'confirmed':(u&&u.tenancy&&!over4h?'confirmed':'pending');
  var obj={id:uid(),rid:RID,cid:CID,uid:uid_val,uname:uname,uphone:uphone,date:SDATE,s:SSLOTS[0],e:endOf(SSLOTS),slots:SSLOTS.slice(),status:status,created_at:new Date().toISOString()};
  var res=await sb.from('bookings').insert(obj);
  if(res.error){ alert('오류: '+res.error.message); return; }
  bookings.push(obj);
  closeOv('bconfirm'); SSLOTS=[]; renderSlots();
  document.getElementById('selbox').style.display='none';
  alert(status==='confirmed'?'✅ 예약이 확정되었습니다!':'📨 승인 요청이 완료되었습니다.\n관리자 승인 후 확정됩니다.');
}

document.getElementById('book-btn').addEventListener('click', openBconfirm);
loadAll().then(function(){ goLogin(); });
</script>
